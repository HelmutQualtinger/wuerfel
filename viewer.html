<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested Gold Cube – Viewer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #15161a;
    --panel: #1f2026;
    --line: #33353d;
    --text: #e4e4e7;
    --muted: #9a9ba3;
    --accent: #d4a73a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 24px; padding: 0 16px; height: 48px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; color: var(--muted); padding: 14px 12px; cursor: pointer;
    font: inherit; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  header .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  main { flex: 1; position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: flex; }

  /* 3D */
  #view-model canvas { display: block; width: 100%; height: 100%; }
  #model-wrap { flex: 1; position: relative; }
  aside { width: 260px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 20px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  .row label { color: var(--text); }
  .row output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  select, .btn { background: #2a2c33; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { flex: 1; background: #2a2c33; color: var(--muted); border: 0; padding: 5px 0; cursor: pointer; font: inherit; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--accent); color: #15161a; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); pointer-events: none; padding: 24px; }
  .overlay.hidden { display: none; }
  .overlay code { color: var(--text); }

  /* Video */
  #view-video { flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; background: #000; }
  #video { max-width: 100%; max-height: calc(100% - 48px); background: #000; }
  .video-bar { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }

  /* Markdown docs */
  .doc-view { overflow-y: auto; background: var(--bg); }
  .doc-view.active { display: block; }
  .md { max-width: 900px; margin: 0 auto; padding: 32px 32px 64px; line-height: 1.6; font-size: 15px; }
  .md h1 { font-size: 28px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .md h2 { font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-top: 32px; }
  .md h3 { font-size: 16px; margin-top: 24px; }
  .md a { color: var(--accent); }
  .md img { max-width: 100%; height: auto; border-radius: 4px; }
  .md code { background: #2a2c33; padding: 1px 5px; border-radius: 3px; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { background: #1f2026; border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 16px 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel); }
  .md blockquote { margin: 0; padding-left: 16px; border-left: 3px solid var(--line); color: var(--muted); }
  .md .err { color: var(--muted); }

  /* Drop */
  #drop { position: fixed; inset: 0; background: rgba(212, 167, 58, .12); border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center; font-size: 18px; z-index: 10; pointer-events: none; }
  body.dragging #drop { display: flex; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<body>
<header>
  <h1>Nested Gold Cube</h1>
  <nav>
    <button data-view="model" class="active">3D model</button>
    <button data-view="video">Video</button>
    <button data-view="readme">README</button>
    <button data-view="prompt">Prompt</button>
  </nav>
  <span class="hint">Drop a .glb or .mp4 file anywhere to load it</span>
</header>

<main>
  <section id="view-model" class="view active">
    <div id="model-wrap">
      <div id="status" class="overlay">Loading wuerfel_gold.glb …</div>
    </div>
    <aside>
      <h2>View</h2>
      <div class="btn-row">
        <button class="btn" data-cam="iso">Iso</button>
        <button class="btn" data-cam="front">Front</button>
        <button class="btn" data-cam="top">Top</button>
        <button class="btn" data-cam="right">Right</button>
      </div>
      <div class="row"><label><input type="checkbox" id="autorotate"> Auto-rotate</label></div>

      <h2>Section</h2>
      <div class="row"><label><input type="checkbox" id="clip-on"> Cut open</label></div>
      <div class="row">
        <div class="seg" id="clip-axis" style="flex:1">
          <button data-axis="x">X</button><button data-axis="y">Y</button><button data-axis="z" class="active">Z</button>
        </div>
        <button class="btn" id="clip-flip" title="Flip side">⇅</button>
      </div>
      <div class="row"><input type="range" id="clip-pos" min="-30" max="30" step="0.5" value="0"></div>
      <div class="row"><span style="color:var(--muted)">Position</span><output id="clip-out">0.0 mm</output></div>

      <h2>Material</h2>
      <div class="row">
        <select id="material" style="flex:1">
          <option value="gold" selected>Gold (brushed)</option>
          <option value="copper">Copper</option>
          <option value="steel">Brushed steel</option>
          <option value="mahogany">Mahogany</option>
          <option value="glass">Green glass</option>
          <option value="file">As in file</option>
        </select>
      </div>

      <h2>Lighting</h2>
      <div class="row"><label for="exposure">Exposure</label><output id="exposure-out">0.70</output></div>
      <div class="row"><input type="range" id="exposure" min="0.2" max="2.5" step="0.05" value="0.7"></div>
      <div class="row">
        <label for="bg">Background</label>
        <select id="bg">
          <option value="#15161a">Dark</option>
          <option value="#5a5c63">Grey</option>
          <option value="#f2f2f2">Light</option>
        </select>
      </div>
      <div class="row"><label><input type="checkbox" id="wire"> Wireframe</label></div>

      <h2>Model</h2>
      <dl id="info"><dt>File</dt><dd>–</dd></dl>
    </aside>
  </section>

  <section id="view-video" class="view">
    <video id="video" src="wuerfel_rotation.mp4" controls loop muted playsinline preload="metadata"></video>
    <div class="video-bar">
      <label>Speed
        <select id="rate">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <button class="btn" id="frame-back" title="One frame back (,)">◀ Frame</button>
      <button class="btn" id="frame-fwd" title="One frame forward (.)">Frame ▶</button>
      <span id="video-name">wuerfel_rotation.mp4</span>
    </div>
  </section>
  <section id="view-readme" class="view doc-view"><article class="md" data-src="README.md">Loading README.md …</article></section>
  <section id="view-prompt" class="view doc-view"><article class="md" data-src="prompt.md">Loading prompt.md …</article></section>
</main>

<div id="drop">Drop .glb / .gltf or .mp4</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15.0.0/lib/marked.esm.js';

const $ = (id) => document.getElementById(id);

/* ---------- Tabs ---------- */
function showView(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'model') onResize();
  if (name !== 'video') $('video').pause?.();
  const doc = document.querySelector(`#view-${name} .md`);
  if (doc) loadDoc(doc);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.view));

/* ---------- 3D scene ---------- */
const wrap = $('model-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.7;
renderer.localClippingEnabled = true;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color($('bg').value);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(1, 2, 1.5);
scene.add(keyLight);

const camera = new THREE.PerspectiveCamera(35, 1, 0.001, 10);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
let model = null, radius = 0.05, center = new THREE.Vector3();
let clipAxis = 'z', clipSign = -1;

function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  redraw();
}
new ResizeObserver(onResize).observe(wrap);

const CAMS = {               // glTF is Y-up: CAD +Z → +Y, CAD +Y → −Z
  iso:   [1, 0.8, 1.2],
  front: [0, 0, 1],         // looking along CAD +Y  (view from −Y)
  top:   [0, 1, 0.0001],
  right: [1, 0, 0],
};
function setCam(name) {
  const d = new THREE.Vector3(...CAMS[name]).normalize();
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.position.copy(center).addScaledVector(d, dist);
  camera.near = dist / 100; camera.far = dist * 10;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setCam(b.dataset.cam));

function eachMaterial(fn) {
  model?.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(fn);
  });
}

function updateClip() {
  const on = $('clip-on').checked;
  const mm = parseFloat($('clip-pos').value);
  $('clip-out').textContent = mm.toFixed(1) + ' mm';
  // UI axes are CAD axes; map to glTF (X→x, Y→−z, Z→y)
  const n = { x: [1, 0, 0], y: [0, 0, -1], z: [0, 1, 0] }[clipAxis];
  clipPlane.normal.set(...n).multiplyScalar(clipSign);
  const c = { x: center.x, y: -center.z, z: center.y }[clipAxis];
  // plane: n·p + d = 0 → keep side where n·p + d ≥ 0
  clipPlane.constant = -clipSign * (c + mm / 1000);
  eachMaterial(m => { m.clippingPlanes = on ? [clipPlane] : []; m.side = on || m.userData.doubleSide ? THREE.DoubleSide : THREE.FrontSide; m.needsUpdate = true; });
}
$('clip-on').onchange = () => { updateClip(); precompile(); };   // toggles clipping/side → new shader variant
$('clip-pos').oninput = updateClip;
$('clip-flip').onclick = () => { clipSign = -clipSign; updateClip(); };
document.querySelectorAll('#clip-axis button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#clip-axis button').forEach(x => x.classList.toggle('active', x === b));
  clipAxis = b.dataset.axis; updateClip();
});

$('autorotate').onchange = e => { controls.autoRotate = e.target.checked; };
$('exposure').oninput = e => { renderer.toneMappingExposure = +e.target.value; $('exposure-out').textContent = (+e.target.value).toFixed(2); };
$('bg').onchange = e => { scene.background.set(e.target.value); };
$('wire').onchange = e => eachMaterial(m => { m.wireframe = e.target.checked; });

function setStatus(text) {
  $('status').innerHTML = text || '';
  $('status').classList.toggle('hidden', !text);
}

// KHR_materials_anisotropy needs a tangent frame. Without UVs/tangents three.js
// derives a degenerate one and the surface blows out, so build tangents from the
// normals: brush direction = horizontal around the vertical axis, X on top/bottom faces.
function addTangents(geo) {
  if (geo.attributes.tangent || !geo.attributes.normal) return;
  const n = geo.attributes.normal, t = new Float32Array(n.count * 4);
  const nv = new THREE.Vector3(), tv = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), ax = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i < n.count; i++) {
    nv.fromBufferAttribute(n, i);
    tv.crossVectors(Math.abs(nv.y) > 0.9 ? ax : up, nv).normalize();
    if (!isFinite(tv.x)) tv.set(1, 0, 0);
    t.set([tv.x, tv.y, tv.z, 1], i * 4);
  }
  geo.setAttribute('tangent', new THREE.BufferAttribute(t, 4));
}

/* ---------- Materials ---------- */
// Metals: physically based F0 colours (linear), roughness, anisotropy along the generated tangents.
function metal(name, rgb, roughness, anisotropy) {
  return new THREE.MeshPhysicalMaterial({
    name, color: new THREE.Color().setRGB(...rgb, THREE.LinearSRGBColorSpace),
    metalness: 1, roughness, anisotropy, anisotropyRotation: 0,
  });
}

// Mahogany: procedural 3D wood grain (the GLB has no UVs), computed from the
// object-space position, so the cube looks cut from one solid block. Grain runs
// along CAD X; growth rings are concentric around that axis, distorted by noise.
function mahogany() {
  const m = new THREE.MeshPhysicalMaterial({
    name: 'Mahogany', color: 0xffffff, metalness: 0, roughness: 0.55,
    clearcoat: 0.8, clearcoatRoughness: 0.12, specularIntensity: 0.4,
  });
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWoodPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWoodPos = position * 1000.0;'); // m → mm
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vWoodPos;
float h31(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float s = 0.0, a = 0.5; for (int k = 0; k < 4; k++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }
vec3 woodColor(vec3 p) {
  vec3 q = p + vec3(0.0, 41.0, -73.0);                          // pith outside the cube
  float r = length(q.yz) + 3.0 * fbm(q * vec3(0.02, 0.12, 0.12));
  float ring = fract(r * 0.32);
  ring = smoothstep(0.0, 0.25, ring) * (1.0 - smoothstep(0.65, 1.0, ring));
  float streak = fbm(vec3(q.x * 0.04, q.y * 1.6, q.z * 1.6));    // fine pores along the grain
  vec3 dark  = vec3(0.045, 0.007, 0.003);
  vec3 light = vec3(0.150, 0.026, 0.010);
  vec3 c = mix(dark, light, 0.35 + 0.45 * ring + 0.2 * streak);
  return c * (0.85 + 0.3 * fbm(p * 0.05));
}`)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );', 'vec4 diffuseColor = vec4( woodColor(vWoodPos), opacity );');
  };
  m.customProgramCacheKey = () => 'mahogany';
  return m;
}

// Green glass: real refraction via three.js transmission. Colour comes mostly from
// absorption (attenuation), so thick walls look deeper green than thin bars.
// Double-sided so the back walls are visible through the front.
function glass() {
  const m = new THREE.MeshPhysicalMaterial({
    name: 'Green glass', color: 0xe8fff0, metalness: 0, roughness: 0.04,
    transmission: 1, ior: 1.52, thickness: 0.006,          // scene units are metres
    attenuationColor: new THREE.Color(0x1f9e4a), attenuationDistance: 0.012,
    specularIntensity: 1, envMapIntensity: 1.2,
  });
  m.userData.doubleSide = true;
  return m;
}

const MATERIALS = {
  gold:     metal('Gold (brushed)', [1.000, 0.766, 0.336], 0.35, 0.7),
  copper:   metal('Copper',         [0.955, 0.638, 0.538], 0.28, 0.0),
  steel:    metal('Brushed steel',  [0.560, 0.570, 0.580], 0.38, 0.85),
  mahogany: mahogany(),
  glass:    glass(),
};

// Shader programs for MeshPhysicalMaterial are large; compiling them synchronously on
// the first render blocks the main thread for ~1 s. compileAsync uses
// KHR_parallel_shader_compile, so the page stays responsive; rendering pauses meanwhile.
let compiling = 0;
async function precompile() {
  if (!model) return;
  compiling++;
  try { await renderer.compileAsync(model, camera, scene); }
  finally { compiling--; redraw(); }
}

function applyMaterial(key) {
  model?.traverse(o => { if (o.isMesh) o.material = key === 'file' ? o.userData.fileMaterial : MATERIALS[key]; });
  updateClip();                                   // re-apply clipping, side and wireframe
  $('wire').dispatchEvent(new Event('change'));
  return precompile();
}
$('material').onchange = e => applyMaterial(e.target.value);

const loader = new GLTFLoader();
function loadModel(url, name) {
  setStatus(`Loading ${name} …`);
  loader.load(url, async gltf => {
    if (model) scene.remove(model);
    model = gltf.scene;
    model.traverse(o => { if (o.isMesh) { addTangents(o.geometry); o.userData.fileMaterial = o.material; } });
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    box.getCenter(center);
    radius = box.getBoundingSphere(new THREE.Sphere()).radius;
    const r = (size.x * 500); // half-extent in mm
    $('clip-pos').min = (-r).toFixed(1); $('clip-pos').max = r.toFixed(1);

    let tris = 0, verts = 0;
    const mats = new Set(), exts = gltf.parser.json.extensionsUsed || [];
    model.traverse(o => {
      if (!o.isMesh) return;
      const g = o.geometry;
      verts += g.attributes.position.count;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      mats.add(o.userData.fileMaterial.name || 'unnamed');
    });
    const mm = v => (v * 1000).toFixed(1) + ' mm';
    $('info').innerHTML = `
      <dt>File</dt><dd>${name}</dd>
      <dt>Size X</dt><dd>${mm(size.x)}</dd>
      <dt>Size Y</dt><dd>${mm(size.z)}</dd>
      <dt>Size Z</dt><dd>${mm(size.y)}</dd>
      <dt>Triangles</dt><dd>${Math.round(tris).toLocaleString('en')}</dd>
      <dt>Vertices</dt><dd>${verts.toLocaleString('en')}</dd>
      <dt>File material</dt><dd>${[...mats].join(', ')}</dd>
      <dt>Extensions</dt><dd>${exts.join('<br>') || '–'}</dd>`;

    setCam('iso');
    setStatus(`Preparing shaders …`);
    await applyMaterial($('material').value);
    setStatus('');
  }, undefined, err => {
    console.error(err);
    setStatus(location.protocol === 'file:'
      ? `Browsers block loading files from <code>file://</code>.<br><br>Serve the folder instead:<br><code>uv run -m http.server 8000</code> → <code>http://localhost:8000/viewer.html</code><br><br>or drop <code>wuerfel_gold.glb</code> onto this window.`
      : `Could not load ${name}: ${err.message || err}`);
  });
}

// Render on demand: only when the camera moves (incl. damping and auto-rotate) or
// something in the scene changed, and never while the 3D tab is hidden.
let dirty = true;
function redraw() { dirty = true; }
controls.addEventListener('change', redraw);
document.querySelector('aside').addEventListener('input', redraw);
document.querySelector('aside').addEventListener('change', redraw);
document.querySelector('aside').addEventListener('click', redraw);
renderer.setAnimationLoop(() => {
  if (!$('view-model').classList.contains('active') || compiling) return;
  controls.update();                              // fires 'change' while moving
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
});

loadModel('wuerfel_gold.glb', 'wuerfel_gold.glb');

/* ---------- Markdown docs ---------- */
// Fetched on first open and re-fetched on every tab switch, so edits show up without reload.
async function loadDoc(el) {
  try {
    const res = await fetch(el.dataset.src, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    el.innerHTML = marked.parse(await res.text());
    // In-page links to repo files: open media/model files in the viewer's own tabs
    el.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/\.mp4$/i.test(href)) a.onclick = e => { e.preventDefault(); showView('video'); };
      else if (/\.glb$/i.test(href)) a.onclick = e => { e.preventDefault(); showView('model'); };
      else if (!href.startsWith('#')) a.target = '_blank';
    });
  } catch (err) {
    el.innerHTML = `<p class="err">Could not load <code>${el.dataset.src}</code>: ${err.message}</p>`;
  }
}

/* ---------- Video ---------- */
const video = $('video');
const FPS = 30;
$('rate').onchange = e => { video.playbackRate = +e.target.value; };
const step = dir => { video.pause(); video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + dir / FPS)); };
$('frame-back').onclick = () => step(-1);
$('frame-fwd').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (!$('view-video').classList.contains('active') || e.target.tagName === 'SELECT') return;
  if (e.key === ',') step(-1);
  else if (e.key === '.') step(1);
  else if (e.key === ' ') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
});

/* ---------- Drag & drop ---------- */
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  for (const file of e.dataTransfer.files) {
    const url = URL.createObjectURL(file);
    if (/\.(glb|gltf)$/i.test(file.name)) { showView('model'); loadModel(url, file.name); }
    else if (/\.(mp4|webm|mov|m4v)$/i.test(file.name) || file.type.startsWith('video/')) {
      video.src = url; $('video-name').textContent = file.name; showView('video'); video.play();
    }
  }
});
</script>
</body>
